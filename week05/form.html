<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review and share your experience.">
    <meta name="author" content="Onayemi Aduragbemi Victor">
    <title>Product Review Form | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
        <p>We value your feedback!</p>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating</legend>

                <div class="rating-options">
                    <div>
                        <input type="radio" id="rating1"
                            name="rating" value="1" required>
                        <label for="rating1">☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating2"
                            name="rating" value="2">
                        <label for="rating2">☆☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating3"
                            name="rating" value="3">
                        <label for="rating3">☆☆☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating4"
                            name="rating" value="4">
                        <label for="rating4">☆☆☆☆</label>
                    </div>

                    <div>
                        <input type="radio" id="rating5"
                            name="rating" value="5">
                        <label for="rating5">☆☆☆☆☆</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate"
                    name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful?</legend>

                <div class="feature-options">
                    <label for="durability">
                        <input type="checkbox" id="durability"
                            name="features" value="Durability">
                        Durability
                    </label>

                    <label for="ease">
                        <input type="checkbox" id="ease"
                            name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance"
                            name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design"
                            name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review"
                    rows="5"
                    placeholder="Tell us about your experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName"
                    name="userName" autocomplete="name">
            </div>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Onayemi Aduragbemi Victor | WDD 131 </p>
        <p>Brigham Young University-Idaho</p>
        <p> Last modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
