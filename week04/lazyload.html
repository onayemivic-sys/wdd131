<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Onayemi Aduragbemi Victor">
    <title>Lazy Loading Images</title>
    <meta name="description" content="This is a webpage that demonstrates lazy loading of images.">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <main>
        <h1>Lazy Loading Images</h1>
        <p>Scroll down to see the images load as you reach them.</p>
            <img 
            src="images/image1.jpg" 
            alt="A beautiful elderly woman dressed in Yoruba traditional attire" loading="lazy" width="400" height="600">

            <img src="images/image2.jpg" alt="Beautiful lady with a sweater and curly hair" loading="lazy" width="400" height="600" >

            <img src="images/image3.jpg" alt="Beautiful lady in a corporate attire" loading="lazy" width="400" height="600">

            <img src="images/image4.jpg" alt="Warm picture with a beautiful lady in black sweater and glasses" loading="lazy" width="400" height="600">

            <img src="images/image5.jpg" alt="A young man in a suit" loading="lazy" width="400" height="600">

            <img src="images/image6.jpg" alt="A beautiful lady in Yoruba traditional attire" loading="lazy" width="400" height="600">
        </main>
    <footer>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p>Last modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
