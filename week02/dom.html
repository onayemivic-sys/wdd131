<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A list of favorite Book of Mormon chapters.">
    <meta name="author" content="Your Name">
    <title>Book of Mormon Chapters</title>
    <link rel="stylesheet" href="styles/bom.css">
     <script src="scripts/bom.js" defer></script>
</head>
<body>
   <main>
    <label for="chapter">Enter a favorite chapter</label>
    <div class="entry-form">
      <input
        type="text"
        id="chapter"
        placeholder="Example: Alma 5"
        autocomplete="off"
      >
      <button type="button" id="add">Add Chapter</button>
    </div>

    <ul id="list" aria-label="Favorite chapters"></ul>
  </main>
</body>
</html>
